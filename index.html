<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dont Wake Grandma!</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <main>
        <section class="home" id="home" aria-labelledby="title">
            <h1 id="title"><span>DONT WAKE</span> GRANDMA!</h1>
            <button id="start" type="button">START GAME</button>
        </section>
        <section class="game" id="game" aria-labelledby="game-title" hidden>
            <h2 id="game-title">The adventure begins here.</h2>
            <button id="back" type="button">MENU</button>
        </section>
    </main>
</body>
</html>
